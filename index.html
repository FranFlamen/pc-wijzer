<title>PC-wijzer P&amp;H</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE work tool for colleagues on the go, calm and fast
   IDEA a pocket loonkaart: the printed card a planner keeps in their wallet
   PICTURE the search field plus the PC card itself, big number, wages and toeslagen
   COLOUR P&H bordeaux #8C2E41 ground on top, white/ink body, rose #E7D8D9 bands, terracotta accent
   TYPE Manrope 800 display + Manrope text
   LAYOUT phone: bordeaux search band, list or card below; laptop: list left, card right */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#1a1013);--ink:light-dark(#132D28,#f3e9ea);--mut:light-dark(#5d6b67,#c2aeb2);--bor:#8C2E41;--rose:light-dark(#E7D8D9,#2b1a1e);--line:light-dark(#e3d2d4,#3b282c);--acc:light-dark(#8C2E41,#e39aab);--terra:#D1645B;--card:light-dark(#fff,#221519)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip}
.top{background:var(--bor);color:#fff;padding:18px max(16px,4vw) 20px;padding-top:max(18px,env(safe-area-inset-top));position:sticky;top:0;z-index:5}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
h1{font-size:clamp(26px,6vw,36px);line-height:1.05;letter-spacing:-.02em;margin:0;font-weight:800}
.stamp{font-size:13px;opacity:.85;white-space:nowrap}
.sw{position:relative}
#q{width:100%;font:600 17px Manrope,sans-serif;padding:14px 44px 14px 16px;border-radius:14px;border:0;background:#fff;color:#132D28;outline:none}
#q:focus{box-shadow:0 0 0 3px #f4becd}
#clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:10px;background:#E7D8D9;color:#8C2E41;font:700 18px Manrope,sans-serif;cursor:pointer;display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;font:600 14px Manrope,sans-serif;cursor:pointer;min-height:36px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);max-width:1240px;margin:0 auto}
@media(min-width:900px){.wrap{grid-template-columns:360px minmax(0,1fr);gap:0}.list .it{padding:12px 16px;grid-template-columns:64px minmax(0,1fr)}.list{border-right:1px solid var(--line);height:calc(100vh - 150px);overflow:auto;position:sticky;top:150px}.top{position:static}}
.list{padding:8px 0}
.it{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:12px max(16px,4vw);font:inherit;cursor:pointer;min-height:56px}
.it:hover,.it[aria-current=true]{background:var(--rose)}
.it b{font-size:20px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
.it span{font-weight:600;line-height:1.3}
.it small{display:block;color:var(--mut);font-weight:500;font-size:13px}
.empty{padding:24px max(16px,4vw);color:var(--mut)}
.card{padding:20px max(16px,4vw) 60px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--rose);color:var(--acc);font:700 15px Manrope,sans-serif;border-radius:10px;padding:10px 14px;cursor:pointer;margin-bottom:14px}
@media(min-width:900px){.back{display:none}}
.head{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.num{background:var(--bor);color:#fff;font-weight:800;font-size:clamp(28px,8vw,44px);line-height:1;padding:12px 14px;border-radius:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
h2{font-size:clamp(22px,5vw,30px);line-height:1.1;letter-spacing:-.02em;margin:2px 0 6px;font-weight:800}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--rose);color:var(--acc);font-size:13px;font-weight:700;border-radius:8px;padding:3px 9px}
h3{font-size:18px;margin:26px 0 10px;font-weight:800;color:var(--acc);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h3 small{font-size:13px;color:var(--mut);font-weight:600}
.wages{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:baseline}
.wr:first-child{border-top:0}
.wr .w{font-weight:800;font-size:19px;white-space:nowrap;font-variant-numeric:tabular-nums}
.wr .cn{font-weight:600}
.wr .cn small{display:block;color:var(--mut);font-weight:500;font-size:13px}
.ages{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin-top:4px}
.age{background:var(--rose);border-radius:9px;padding:6px 8px;font-size:13px;line-height:1.3}
.age b{display:block;font-size:15px;white-space:nowrap}
.extra{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.pill{border:2px solid var(--bor);border-radius:12px;padding:8px 12px;font-weight:600}
.pill b{font-size:18px;white-space:nowrap}
.grp{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px}
@media(max-width:520px){.grp{grid-template-columns:minmax(0,1fr);gap:4px}}
.gn{font-weight:800;font-size:14px;color:var(--mut)}
.ru{margin-bottom:8px}
.ru:last-child{margin-bottom:0}
.rv{font-weight:800;font-size:18px;white-space:nowrap;color:var(--ink)}
.rn{font-weight:600}
.rc{font-size:14px;color:var(--mut)}
.rt{font-size:13px;color:var(--mut)}
.note{margin-top:28px;font-size:13px;color:var(--mut);border-top:3px solid var(--terra);padding-top:10px}
.hidden{display:none}
@media(max-width:899px){.wrap.show .list{display:none}.wrap:not(.show) .card{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>PC-wijzer</h1><span class="stamp">Silver Tie P&amp;H</span></div>
  <div class="sw"><input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Zoek PC-nummer of sector" aria-label="Zoek paritair comité"><button id="clr" aria-label="Wissen">×</button></div>
  <div class="chips" id="recent"></div>
</header>
<main class="wrap" id="wrap">
  <nav class="list" id="list" aria-label="Paritaire comités"></nav>
  <section class="card" id="card"></section>
</main>
<script>
{
const parseCSV=txt=>{txt=txt.replace(/^\uFEFF/,'');const rows=[];let row=[],f='',q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch=='"'){if(txt[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}else if(ch=='"')q=true;else if(ch==';'){row.push(f);f=''}else if(ch=='\n'){row.push(f);rows.push(row);row=[];f=''}else if(ch!='\r')f+=ch}if(f||row.length){row.push(f);rows.push(row)}const h=rows.shift().map(x=>x.trim());return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])))};
const toNum=s=>{s=String(s||'').replace(/[€\s]/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0};
const get=f=>fetch(f+'?v='+Date.now()).then(r=>{if(!r.ok)throw new Error(f);return r.text()}).then(parseCSV);
async function load(){
const [P,L,T]=await Promise.all([get('pcs.csv'),get('lonen.csv'),get('toeslagen.csv')]);
return P.filter(p=>p.pc).map(p=>({nr:p.pc,n:p.naam,s:p.statuut,b:/^j/i.test(p.barema_lonen),
 wg:Object.fromEntries([['FLX',toNum(p.flexiloon)],['STU',toNum(p.studentloon)]].filter(x=>x[1]>0)),
 cats:L.filter(l=>l.pc===p.pc).map(l=>({n:l.categorie,w:toNum(l.uurloon),f:parseInt(l.aantal_functies)||0,a:(l.jongerenloon||'').split(';').map(x=>x.split('=')).filter(x=>x.length==2).map(([a,v])=>[parseInt(a),toNum(v)]).sort((x,y)=>x[0]-y[0])})),
 r:T.filter(r=>r.pc===p.pc).map(r=>({g:r.soort||'Overige vergoedingen',n:r.toeslag,v:r.bedrag,c:r.voorwaarden,t:r.geldt_voor||'Alle'}))}));
}
let DATA=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const eur=(v,d=2)=>'€ '+v.toLocaleString('nl-BE',{minimumFractionDigits:2,maximumFractionDigits:d});
const pct=v=>v.toLocaleString('nl-BE',{maximumFractionDigits:2})+' %';
const slug=nr=>'pc-'+nr.replace(/\./g,'-');
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const $=id=>document.getElementById(id);
const list=$('list'),card=$('card'),q=$('q'),wrap=$('wrap'),clr=$('clr'),recentEl=$('recent');
let recent=[];try{recent=JSON.parse(localStorage.getItem('pcw-recent')||'[]')}catch(e){}
const range=p=>{const w=p.cats.map(c=>c.w).filter(x=>x>0);if(!w.length)return 'geen basisloon';const a=Math.min(...w),b=Math.max(...w);return a===b?eur(a):eur(a)+' – '+eur(b)};
function renderList(){
  const t=norm(q.value.trim());clr.style.display=t?'block':'none';
  const cur=location.hash.slice(1);
  const hits=DATA.filter(p=>!t||p.nr.startsWith(t)||p.nr.replace('.','').startsWith(t.replace('.',''))||norm(p.n).includes(t)||p.r.some(r=>norm(r.n).includes(t)&&t.length>3));
  list.innerHTML=hits.length?hits.map(p=>`<button class="it" data-nr="${esc(p.nr)}" aria-current="${slug(p.nr)===cur}"><b>${esc(p.nr)}</b><span>${esc(p.n)}<small>${esc(range(p))} · ${p.r.length} toeslagen</small></span></button>`).join(''):'<p class="empty">Geen paritair comité gevonden. Probeer een nummer (bv. 302) of een deel van de naam.</p>';
}
function renderRecent(){recentEl.innerHTML=recent.map(nr=>`<button class="chip" data-nr="${esc(nr)}">PC ${esc(nr)}</button>`).join('')}
function show(nr){
  const p=DATA.find(x=>x.nr===nr);
  if(!p){wrap.classList.remove('show');card.innerHTML=window.innerWidth>=900?'<p class="empty">Kies links een paritair comité.</p>':'';return}
  wrap.classList.add('show');
  recent=[nr,...recent.filter(x=>x!==nr)].slice(0,4);try{localStorage.setItem('pcw-recent',JSON.stringify(recent))}catch(e){}
  renderRecent();
  const tags=[p.s,p.b?'Barema-lonen':'Geen barema-lonen'].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  const cats=p.cats.length?p.cats.map(c=>`<div class="wr"><div class="cn">${esc(c.n)}<small>${c.f} functie${c.f===1?'':'s'}</small></div><div class="w">${c.w?eur(c.w,4):'–'}</div>${c.a.length&&c.w?`<div class="ages">${c.a.map(([a,pc])=>`<div class="age">${a} jaar<b>${eur(c.w*pc/100)}</b>${pct(pc)}</div>`).join('')}</div>`:''}</div>`).join(''):'<div class="wr"><div class="cn">Geen categorieën ingesteld</div></div>';
  const ex=[];if(p.wg.FLX)ex.push(`<div class="pill">Flexi-loon <b>${eur(p.wg.FLX,4)}</b> /uur</div>`);if(p.wg.STU)ex.push(`<div class="pill">Student <b>${eur(p.wg.STU,4)}</b> /uur</div>`);
  const groups=[...new Set(p.r.map(r=>r.g))];
  const rules=groups.length?groups.map(g=>`<div class="grp"><div class="gn">${esc(g)}</div><div>${p.r.filter(r=>r.g===g).map(r=>`<div class="ru"><span class="rv">${esc(r.v)}</span> <span class="rn">${esc(r.n)}</span>${r.c?`<div class="rc">${esc(r.c)}</div>`:''}<div class="rt">Geldt voor: ${esc(r.t)}</div></div>`).join('')}</div></div>`).join(''):'<p class="rc">Geen toeslagen ingesteld.</p>';
  card.innerHTML=`<button class="back" id="back">← Alle PC's</button>
  <div class="head"><div class="num">${esc(p.nr)}</div><div><h2>${esc(p.n)}</h2><div class="tags">${tags}</div></div></div>
  <h3>Basisuurlonen <small>per categorie</small></h3><div class="wages">${cats}</div>${ex.length?`<div class="extra">${ex.join('')}</div>`:''}
  <h3>Toeslagen <small>${p.r.length} regels</small></h3>${rules}
  <p class="note">Enkel voor intern gebruik bij Silver Tie. Percentages zijn een toeslag op het uurloon. Jongerenlonen: uurloon en % van het basisloon. Contracttypes: OTH arbeider/bediende, STU student, WSTU werkstudent, FLX flexi-job, EXT extra, VRIJ vrijwilliger, FREE freelancer, VAST vaste medewerker.</p>`;
  $('back').addEventListener('click',()=>{location.hash='';});
  renderList();
  if(window.innerWidth<900)window.scrollTo(0,0);
}
function route(){const h=location.hash.slice(1);const p=DATA.find(x=>slug(x.nr)===h);show(p?p.nr:null);renderList()}
list.addEventListener('click',e=>{const b=e.target.closest('[data-nr]');if(b)location.hash=slug(b.dataset.nr)});
recentEl.addEventListener('click',e=>{const b=e.target.closest('[data-nr]');if(b)location.hash=slug(b.dataset.nr)});
q.addEventListener('input',()=>{renderList();if(window.innerWidth<900&&location.hash)location.hash=''});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=list.querySelector('[data-nr]');if(f){location.hash=slug(f.dataset.nr);q.blur()}}});
clr.addEventListener('click',()=>{q.value='';renderList();q.focus()});
window.addEventListener('hashchange',route);
list.innerHTML='<p class="empty">Gegevens laden…</p>';
load().then(d=>{DATA=d;renderRecent();if(!location.hash&&window.innerWidth>=900)location.hash=slug('302');else route()}).catch(e=>{list.innerHTML='<p class="empty">De gegevens konden niet geladen worden ('+esc(e.message)+'). Probeer later opnieuw.</p>'});
}
</script>
</body>
</html>
